[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 1
via_ir = true

# Allow access to local directories if needed
fs_permissions = [{ access = "read", path = "./" }]
fuzz = { runs = 64 }
invariant = { runs = 16, depth = 32 }

[profile.ci]
fuzz = { runs = 256 }
invariant = { runs = 64, depth = 64 }

[rpc_endpoints]
unichain_sepolia = "https://sepolia.unichain.org"
reactive_lasna = "https://lasna-rpc.rnk.dev/"
