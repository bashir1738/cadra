[profile.default]
src = "src"
libs = ["lib", "../lib"]
solc_version = "0.8.26"
optimizer = true
optimizer_runs = 200

remappings = [
    "@reactive/=lib/reactive-lib-omni/",
    "forge-std/=../lib/forge-std/src/"
]

[rpc_endpoints]
unichain_sepolia = "https://sepolia.unichain.org"
reactive_lasna = "https://lasna-rpc.rnk.dev/"
